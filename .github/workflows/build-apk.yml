name: Build Android APK

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-apk:
    name: Build Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install NPM Dependencies
        run: npm ci

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Verify Java Environment
        run: |
          java -version
          chmod +x android/gradlew
          cd android && ./gradlew -version

      - name: Set up Android SDK and Configure PATH
        run: |
          ANDROID_SDK_PATH="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          echo "ANDROID_HOME=$ANDROID_SDK_PATH" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_PATH" >> $GITHUB_ENV

          SDKMANAGER_BIN=""
          CANDIDATES=(
            "$ANDROID_SDK_PATH/cmdline-tools/latest/bin/sdkmanager"
            "$ANDROID_SDK_PATH/cmdline-tools/bin/sdkmanager"
            "$ANDROID_SDK_PATH/tools/bin/sdkmanager"
          )
          for candidate in "${CANDIDATES[@]}"; do
            if [ -x "$candidate" ]; then
              SDKMANAGER_BIN="$candidate"
              break
            fi
          done

          if [ -z "$SDKMANAGER_BIN" ] && [ -d "$ANDROID_SDK_PATH/cmdline-tools" ]; then
            SDKMANAGER_BIN=$(find "$ANDROID_SDK_PATH/cmdline-tools" -name sdkmanager -type f -perm -111 2>/dev/null | head -n 1)
          fi

          if [ -z "$SDKMANAGER_BIN" ]; then
            echo "Installing Android SDK Command-line Tools..."
            mkdir -p "$ANDROID_SDK_PATH/cmdline-tools"
            curl -sSfo commandlinetools.zip https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
            unzip -q commandlinetools.zip -d "$ANDROID_SDK_PATH/cmdline-tools"
            rm -f commandlinetools.zip
            mv "$ANDROID_SDK_PATH/cmdline-tools/cmdline-tools" "$ANDROID_SDK_PATH/cmdline-tools/latest"
            SDKMANAGER_BIN="$ANDROID_SDK_PATH/cmdline-tools/latest/bin/sdkmanager"
          fi

          CMDLINE_DIR=$(dirname "$SDKMANAGER_BIN")
          echo "$CMDLINE_DIR" >> $GITHUB_PATH
          echo "$ANDROID_SDK_PATH/platform-tools" >> $GITHUB_PATH
          echo "Configured sdkmanager directory: $CMDLINE_DIR"

      - name: Verify sdkmanager and Accept Licenses
        run: |
          which sdkmanager
          sdkmanager --version
          yes | sdkmanager --licenses

      - name: Install Android SDK Platform 36 and Build-Tools
        run: |
          sdkmanager "platforms;android-36" "build-tools;36.0.0" "platform-tools"

      - name: Build Web Application & Synchronize Capacitor
        run: npm run build:android

      - name: Build Android APK with Gradle
        working-directory: android
        run: ./gradlew assembleDebug --stacktrace

      - name: Verify Generated APK
        run: |
          APK_FILE="android/app/build/outputs/apk/debug/app-debug.apk"
          if [ ! -f "$APK_FILE" ]; then
            echo "ERROR: APK was not generated at $APK_FILE"
            exit 1
          fi
          echo "SUCCESS: Found verified Android APK at $APK_FILE"
          ls -lh "$APK_FILE"

      - name: Upload Android APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: GamingShell-app-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
